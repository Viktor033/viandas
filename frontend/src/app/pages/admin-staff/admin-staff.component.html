<div class="admin-staff-container">
    <div class="header-section">
      <h1>Gestión de Personal</h1>
      <button class="btn-add" (click)="abrirModalNuevo()">
        <i class="fas fa-plus"></i> Nuevo Personal
      </button>
    </div>
  
    <div class="table-container">
      <table class="staff-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of staffList">
            <td>
              <strong>{{ user.nombre }} {{ user.apellido }}</strong>
            </td>
            <td>{{ user.email }}</td>
            <td>
              <span class="role-badge" [class.admin]="user.rol === 'ADMIN'" [class.cocina]="user.rol === 'COCINERO'">
                {{ user.rol }}
              </span>
            </td>
            <td>
              <span class="status-badge" [class.active]="user.activo" [class.inactive]="!user.activo">
                {{ user.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="actions">
              <button class="btn-edit" (click)="editarUsuario(user)" title="Editar">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-delete" (click)="eliminarUsuario(user)" title="Eliminar">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Modal -->
    <div class="modal-overlay" *ngIf="showModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>{{ isEditing ? 'Editar Personal' : 'Nuevo Personal' }}</h2>
          <button class="close-btn" (click)="cerrarModal()">&times;</button>
        </div>
        
        <form (ngSubmit)="guardarUsuario()">
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" [(ngModel)]="editingUser.nombre" name="nombre" required>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" [(ngModel)]="editingUser.apellido" name="apellido" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" [(ngModel)]="editingUser.email" name="email" required>
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" [(ngModel)]="editingUser.telefono" name="telefono">
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select [(ngModel)]="editingUser.rol" name="rol" required>
                  <option value="COCINERO">COCINERO</option>
                  <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="form-group">
                <label>Contraseña (Clave General)</label>
                <input type="password" [(ngModel)]="passwordTemp" name="password" [placeholder]="isEditing ? 'Dejar en blanco para no cambiar' : 'Clave de acceso'">
            </div>
          </div>
  
          <div class="modal-footer">
            <button type="button" class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
            <button type="submit" class="btn-save">Guardar</button>
          </div>
        </form>
      </div>
    </div>
</div>
